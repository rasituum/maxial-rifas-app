  <body>
    <form name="formRifas"  method="post" action="/cgi-bin/upload.cgi" ENCTYPE="multipart/form-data">
    <div class="container">
      <div class="inputfield">
        <input type="number" maxlength="1" class="input" disabled />
        <input type="number" maxlength="1" class="input" disabled />
        <input type="number" maxlength="1" class="input" disabled />
      </div>
      <div id="upload">
        <label for="photo">Choose a photo
	  <input type="file" name="photo" id="photo" class="inputfile" required/>
	</label>
      </div>
      <button class="hide" id="submit" onclick="searchRifas()">upload</button>
      <img src="refresh.png" type="button" class="hide" id="refresh" onclick="startInput()"/>
    </div>
    <input type="hidden" id="numero" name="numero" />
    </form>
    <!-- Script -->
    <script src="script.js"></script>
  </body>
